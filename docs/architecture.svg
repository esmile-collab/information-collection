<title id="title">信息决策中台：系统架构与反馈闭环</title>
<desc id="desc">从决策问题出发，沿证据完成核验与修正。决策问题：用途 · 范围 · 完成条件；决策与路由：选来源，确定采集路线；按来源采集：视频 · 图文 · Reddit；证据核验：回看原文，核对冲突；缺口与问题记录：保留证据、冲突与限制；补采与修正：重选来源，回听与校对；证据与可复用方法：来源记录 · 原始媒体 · 验证后的 Skill；可复核结论：依据 · 缺口 · 建议。宿主 Agent 按 Skill 执行；核验与方法沉淀包含人工参与。 访问受阻时保留缺口并停止；后续只补充会改变决策的证据。</desc>
